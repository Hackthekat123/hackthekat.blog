body { background-color: #0d1117 !important; color: #c9d1d9 !important; }

.wg-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

.wg-subtitle { color: #6b7785; font-size: 0.9rem; margin: 0 0 1.5rem; }

.wg-filters {

  flex-wrap: wrap; align-items: center;
}
.wg-search {
  flex: 1; min-width: 200px; max-width: 350px;

.wg-select {

.wg-count { color: #6b7785; font-size: 0.85rem; font-family: monospace; margin-left: auto; white-space: nowrap; }

.wg-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.2rem;
}
.wg-card {
  background: #161b22; border: 1px solid #21262d;

  text-decoration: none; display: block;
  transition: border-color .2s, transform .2s, box-shadow .2s;
  color: inherit;
}
.wg-card:hover {

  box-shadow: 0 6px 20px rgba(0,0,0,0.4);

.wg-name { font-size: 1.1rem; font-weight: 600; color: #fff; font-family: monospace; }
.wg-badges { display: flex; gap: 0.35rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.wg-badge {
  font-size: 0.7rem; padding: 0.18rem 0.55rem; border-radius: 4px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; font-family: monospace;

.wg-desc { color: #8b949e; font-size: 0.875rem; line-height: 1.5; margin: 0; }
.wg-empty { text-align: center; color: #6b7785; padding: 4rem 0; font-family: monospace; }

function osBadge(os){ return os==="Linux"?'<span class="wg-badge os-linux">Linux</span>':'<span class="wg-badge os-win">Windows</span>'; }
function diffBadge(d){
  const cls={Easy:"d-easy",Medium:"d-med",Hard:"d-hard",Insane:"d-insane"}[d]||"d-med";
  return `<span class="wg-badge ${cls}">${d}</span>`;
}
function render(list){
  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  document.getElementById("cnt").textContent=`${list.length} machines`;
  if(!list.length){grid.innerHTML="";empty.style.display="block";return;}
  empty.style.display="none";
  grid.innerHTML=list.map(m=>`
    <a href="${m.url}" class="wg-card">
      <div class="wg-card-header">
        <span class="wg-name">${m.name}</span>
        <span class="wg-badges">${osBadge(m.os)}${diffBadge(m.diff)}</span>
      </div>
      <p class="wg-desc">${m.desc}</p>
    </a>`).join("");
}
function filter(){
  const q=document.getElementById("srch").value.toLowerCase();
  const d=document.getElementById("fdiff").value;
  const o=document.getElementById("fos").value;
  render(machines.filter(m=>
    (!q||m.name.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q))&&
    (!d||m.diff===d)&&
    (!o||m.os===o)
  ));
}
document.getElementById("srch").addEventListener("input",filter);
render(machines);
